<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Platform Finder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <p class="eyebrow">Discover your digital home</p>
        <h1>Find Your Social Media Platform</h1>
        <p class="subtitle">
          Choose the things you love, and we’ll suggest the best platform for you.
        </p>
      </header>

      <section class="selector">
        <div id="interest-pills" class="interest-pills"></div>
      </section>

      <button id="find-btn" class="primary-btn">Find My Platform</button>

      <section id="results" class="results"></section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
